<nav class="navbar">
  <div class="navbar-inner">

    <a class="navbar-brand" href="{{ url('events:home') }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5V9Z" stroke="var(--accent)" stroke-width="1.75" stroke-linejoin="round"/>
        <path d="M15 7v10" stroke="var(--accent)" stroke-width="1.75" stroke-dasharray="2 2.5" stroke-linecap="round"/>
      </svg>
      TickIt
    </a>

    <div class="nav-links">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{{ url('tickets:cart') }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          </svg>
          Cart
        </a>
        <a class="nav-link" href="{{ url('tickets:my_tickets') }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5V9Z"/>
          </svg>
          My Tickets
        </a>
        {% if user.profile.is_organizer() %}
          <div class="nav-divider" aria-hidden="true"></div>
          <a class="nav-link nav-link--accent" href="{{ url('events:organizer_event_list') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
            </svg>
            My Events
          </a>
          <a class="nav-link nav-link--accent" href="{{ url('events:venue_list') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 21s-7-6.5-7-11.5a7 7 0 0 1 14 0C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
            </svg>
            Venues
          </a>
        {% endif %}
      {% else %}
        <a class="nav-link" href="{{ url('accounts:login') }}">Log in</a>
        <a class="nav-link" href="{{ url('accounts:signup') }}">Sign up</a>
      {% endif %}
    </div>

    {% if user.is_authenticated %}
      <div class="nav-auth">
        <div class="nav-user">
          <span class="nav-user__name">{{ user.username }}</span>
          <span class="nav-user__role">{{ user.profile.get_role_display() }}</span>
        </div>
        <form method="post" action="{{ url('accounts:logout') }}" class="inline">
          {{ csrf_input }}
          <button type="submit" class="btn btn-secondary btn-sm">Log out</button>
        </form>
      </div>
    {% endif %}

  </div>
</nav>
