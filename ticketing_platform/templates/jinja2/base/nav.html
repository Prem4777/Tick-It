<header class="navbar-wrapper">
  <nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-inner">

      <a class="navbar-brand" href="{{ url('events:home') }}">
        <span class="brand-ticket-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5V9Z" fill="#151313" stroke="#151313" stroke-width="1.8"/>
            <path d="M15 7v10" stroke="#FFFAEF" stroke-width="2" stroke-dasharray="2 2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">TICKIT</span>
        <span class="brand-edition">v2.6</span>
      </a>

      <div class="nav-links">
        <a class="nav-link" href="{{ url('events:home') }}">
          <span>DISCOVER</span>
        </a>
        {% if user.is_authenticated %}
          <a class="nav-link" href="{{ url('tickets:cart') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>CART</span>
          </a>
          <a class="nav-link" href="{{ url('tickets:my_tickets') }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1.5a2.5 2.5 0 0 0 0-5V9Z"/>
            </svg>
            <span>MY TICKETS</span>
          </a>
          {% if user.profile.is_organizer() %}
            <div class="nav-divider" aria-hidden="true"></div>
            <a class="nav-link nav-link--organizer" href="{{ url('events:organizer_event_list') }}">
              <span>DASHBOARD</span>
            </a>
            <a class="nav-link nav-link--organizer" href="{{ url('events:venue_list') }}">
              <span>VENUES</span>
            </a>
          {% endif %}
        {% else %}
          <a class="nav-link" href="{{ url('accounts:login') }}">LOGIN</a>
          <a class="nav-link nav-link--highlight" href="{{ url('accounts:signup') }}">SIGN UP</a>
        {% endif %}
      </div>

      {% if user.is_authenticated %}
        <div class="nav-auth">
          <div class="nav-user-badge">
            <span class="nav-user-name">{{ user.username }}</span>
            <span class="nav-role-tag nav-role-tag--{{ user.profile.role }}">{{ user.profile.get_role_display() }}</span>
          </div>
          <form method="post" action="{{ url('accounts:logout') }}" class="inline">
            {{ csrf_input }}
            <button type="submit" class="btn btn-secondary btn-sm nav-logout-btn">LOGOUT</button>
          </form>
        </div>
      {% endif %}

    </div>
  </nav>
</header>
